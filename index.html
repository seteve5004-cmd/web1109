
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방문 카운터 쿠키</title>

<script>
function GetCookie(name) {
    let pairs = document.cookie.split(";");

    for(let i=0; i<pairs.length; i++) {
        let pair = pairs[i].trim();
        let unit = pair.split("=");

        if(unit[0] == name)
            return unescape(unit[1]);
    }
    return null;
}

function SetCookie(name, val, expireDate) {
    let cookieStr = name + "=" + escape(val);

    if(expireDate == null)
        expireDate = "";
    else
        expireDate = ";expires=" + expireDate.toUTCString();

    document.cookie = cookieStr + expireDate;
}
</script>
</head>

<body>
<script>
let username = GetCookie("username");
let count = GetCookie("count");
let expire = new Date();

if(username == null) {
    count = 0;
    username = prompt("이름을 입력하세요?");

    if(username == null) {
        alert("이름을 입력해야 쿠키에 저장됩니다");
        username = "아무개";
    }
}

expire.setTime(expire.getTime() + (365*24*3600*1000));

SetCookie("username", username, expire);

count = Number(count);
count++;

SetCookie("count", count, expire);

document.write("<br>" + username + "님");
document.write(count + "번째 방문을 환영합니다!");
</script>
</body>
</html>
